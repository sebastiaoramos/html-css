<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 500px;
            border-collapse: collapse;
        }

        td, th {
            border: 1px solid black;
            padding: 10px;
        }

        thead {
            background-color: gray;
            color: white;
        }
        tfoot {
            background-color: gray;
        }
                }
    </style>
</head>
<body>
    <h1>Uso de tabelas grandes</h1>
    <!--ANATOMIA PARA TABELAS GRANDES
    TABLE
        THEAD
            TR, TD, TH
        TBODY
            TR, TD, TH
        TFOOT
            TR, TD, TH
        -->
    <Table>
        <thead>
            <tr>
                <th>Estado</th>
                <th>População</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>São Paulo</td>
                <td>46 081 801</td>
            </tr>
            <tr>
                <td>Minas Gerais</td>
                <td>21 393 441</td>
            </tr>
            <tr>
                <td>Rio de Janeiro</td>
                <td>17 223 547</td>
            </tr>
            <tr>
                <td>Bahia</td>
                <td>14 870 907</td>
            </tr>
            <tr>
                <td>Paraná</td>
                <td>11 890 517</td>
            </tr>
            <tr>
                <td>Rio Grande do Sul</td>
                <td>11 233 263</td>
            </tr>
            <tr>
                <td>Pernambuco</td>
                <td>9 562 007</td>
            </tr>
            <tr>
                <td>Ceará</td>
                <td>9 268 836</td>
            </tr>
            <tr>
                <td>Pará</td>
                <td>8 711 196</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th>Total de Habitantes</th>
                <td>0000</td>
            </tr>
        </tfoot>
    </Table>
</body>
</html>
