<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionando conteúdos</title>
</head>
<body>
    <h1>Conteúdos dentro de iframe</h1>
    <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Ipsa sunt, unde voluptates nostrum, vero repellat vel necessitatibus maiores sint, rem ullam dolores consequuntur expedita. Voluptatibus quo perferendis fugiat at voluptas?</p>
    <h2>Vídeos</h2>

    <iframe width="560" height="315" src="https://www.youtube.com/embed/mi2xXEXYlzw?si=xjpJODSd2HqLk9Up" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

    <h2>Google Maps</h2>
    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3976.464526783943!2d-46.9856511!3d-4.689047200000001!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x92c5f5d9849ecb75%3A0x8a69d0bcb34723a8!2sRECANTO%20AQUAVIVA!5e0!3m2!1spt-BR!2sbr!4v1761079238447!5m2!1spt-BR!2sbr" width="560" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>

    <h2>Maps waze</h2>
    <iframe src="https://embed.waze.com/iframe?zoom=16&lat=-4.688562&lon=-46.983295&ct=livemap" width="560" height="450" allowfullscreen></iframe>

    <h2>Slides</h2>
    <iframe src="https://docs.google.com/presentation/d/e/2PACX-1vS_9xhA3Auzc5dVP9dF6__RZZ2uCzes0o6Pq1jE7S6oQoSrrdAaHGFLr4cNMpysc0oyW01gVLdORDCu/pubembed?start=false&loop=false&delayms=1000" frameborder="0" width="480" height="299" allowfullscreen="true" mozallowfullscreen="true" webkitallowfullscreen="true"></iframe>

</body>
</html>
